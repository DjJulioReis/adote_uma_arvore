<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Adoções - Adote uma Árvore</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container {
            max-width: 900px;
            margin: 30px auto;
        }
        .summary-card {
            background: var(--primary-color);
            color: #fff;
            padding: 30px;
            border-radius: var(--border-radius);
            text-align: center;
            margin-bottom: 30px;
        }
        .summary-card h3 {
            margin: 0;
            font-size: 2.5em;
        }
        .adoption-list .adoption-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 15px;
            background: #fff;
            box-shadow: var(--box-shadow);
            border-radius: var(--border-radius);
            margin-bottom: 15px;
        }
        .adoption-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: var(--border-radius);
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html" style="color: #fff; text-decoration: none;"><h1 data-translate-key="title">Adote uma Árvore</h1></a>
            <nav id="user-nav"></nav>
        </div>
    </header>

    <main class="container">
        <div class="dashboard-container">
            <h2 id="welcome-message">Bem-vindo!</h2>

            <div class="summary-card">
                <p>Total de Carbono Compensado Anualmente</p>
                <h3 id="total-carbon-offset">-- kg</h3>
            </div>

            <h3>Suas Adoções</h3>
            <div id="adoption-list" class="adoption-list">
                <!-- Adoções serão inseridas aqui -->
            </div>
        </div>
    </main>

    <script src="header.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
