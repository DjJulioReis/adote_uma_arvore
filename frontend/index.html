<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate-key="title">Adote uma Árvore</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container">
            <a href="index.html" class="logo-container">
                <img src="../assets/images/logo.png" alt="Logo" class="header-logo">
                <h1 data-translate-key="title">Adote uma Árvore</h1>
            </a>
            <div id="controls-nav">
                <div class="language-selector">
                    <select id="lang-select">
                        <option value="pt">Português</option>
                        <option value="en">English</option>
                    </select>
                </div>
            </div>
            <nav id="user-nav">
                <!-- Conteúdo dinâmico via header.js -->
            </nav>
        </div>
    </header>

    <main>
        <section class="intro container">
            <h2 data-translate-key="subtitle">Ajude a preservar a Mata Atlântica em Pontal do Paraná.</h2>
            <div id="map-container" style="position: relative;">
                <div id="map"></div>
                <div id="species-preview-card" class="preview-card" style="display: none;">
                    <img id="preview-image" src="" alt="Espécie">
                    <h4 id="preview-name"></h4>
                </div>
            </div>
        </section>

        <section class="fauna-flora">
            <div class="container">
                <h2 data-translate-key="fauna_flora_title">Flora e Fauna de Pontal do Paraná</h2>
                <p data-translate-key="fauna_flora_description">A região de Pontal do Paraná...</p>
            </div>
        </section>

        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2023 Adote uma Árvore. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="i18n.js"></script>
    <script src="header.js"></script>
    <script src="script.js"></script>
</body>
</html>
